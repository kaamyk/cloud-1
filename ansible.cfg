[defaults]
; Hosts to deploy to (groups cloud1 / cloud221). Used when no -i option is given.
inventory = ./inventory.yml
; Where the playbook looks for its roles (system, firewall, docker, tls, compose, wordpress).
roles_path = ./roles
; Folder on the servers where Ansible uploads its temporary module files
; (default: ~/.ansible/tmp). Kept from the local VM tests, where it avoided
; permission problems when "become" switches from the SSH user to root.
remote_tmp = /tmp/user
; Password that decrypts the Ansible Vault files (group_vars/*/secret.yml).
; This file is NOT in git (.gitignore): it must be created on each controller.
vault_password_file = ./.vault_pass
; Debug only: uncomment to hide tasks that are skipped / unchanged (ok).
; Keep commented for the defense, so a 2nd run visibly shows only ok/skipped.
; display_skipped_hosts = false
; display_ok_hosts = false

[ssh_connection]
; -C                               compress SSH traffic
; ControlMaster / ControlPersist   reuse one SSH connection for 60 s
;                                  instead of opening one per task (faster)
; StrictHostKeyChecking=accept-new trust a server's host key automatically the
;                                  FIRST time (fresh instances need no manual
;                                  "yes"), but refuse if a known server's key
;                                  changes later (protects against spoofing)
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

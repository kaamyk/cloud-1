- name: TLS - Create certs directory
  ansible.builtin.file:
    path: "{{ app_dir }}/certs"
    state: directory
    mode: "0700"

# Read-only: which IP is inside the current cert? (rc != 0 if no cert yet)
- name: TLS - Read current certificate SAN
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ app_dir }}/certs/cloud1.crt"
      - -noout
      - -ext
      - subjectAltName
  register: cert_san
  changed_when: false
  failed_when: false
  check_mode: false

# Self-signed certificate. (Re)generated only when there is no cert yet or
# when the IP inside it is not the current ansible_host (IP changed).
- name: TLS - Generate self-signed certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - "365"
      - -keyout
      - "{{ app_dir }}/certs/cloud1.key"
      - -out
      - "{{ app_dir }}/certs/cloud1.crt"
      - -subj
      - "/CN={{ ansible_host }}"
      - -addext
      - "subjectAltName=IP:{{ ansible_host }}"
  when: ("IP Address:" ~ ansible_host) not in (cert_san.stdout_lines | map('trim') | list)
  notify: Restart nginx

# In --check mode openssl does not really run, so on a host without a cert
# (cert_san.rc != 0) the key does not exist yet: skip in that case only.
- name: TLS - Restrict private key permissions
  ansible.builtin.file:
    path: "{{ app_dir }}/certs/cloud1.key"
    mode: "0600"
  when: not ansible_check_mode or cert_san.rc == 0
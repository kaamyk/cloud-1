- name: Wait for MySQL
  ansible.builtin.wait_for:
    host: cloud
    port: 3306
    connect_timeout: 5 #Default
    delay: 2
    timeout: 30

- name: Lancer WordPress
  community.docker.docker_container:
    name: wordpress
    image: wordpress:7.1-php8.2-apache
    networks:
        - name: app_net
    volumes:
      - wp_data:/var/www/html
    env:
      WORDPRESS_DB_HOST: "{{ vault_mysql_database }}"
      WORDPRESS_SB_USER: "{{ vault_mysql_user }}"
      WORDPRESS_DB_PASSWORD: "{{ vault_mysql_user_password }}"
      
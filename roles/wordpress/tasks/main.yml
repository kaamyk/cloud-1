- name: WORDPRESS - Wait for MySQL
  ansible.builtin.command:
    cmd: docker exec mysql mysqladmin ping -h localhost
  register: mysql_ready
  until: mysql_ready.rc == 0
  retries: 10
  delay: 3
  changed_when: false

- name: WORDPRESS - Lancer le conteneur
  community.docker.docker_container:
    name: wordpress
    image: wordpress:7.1-php8.2-apache
    networks:
        - name: app_net
    volumes:
      - wp_data:/var/www/html
    env:
      WORDPRESS_DB_HOST: "mysql"
      WORDPRESS_DB_NAME: "{{ vault_mysql_database }}"
      WORDPRESS_DB_USER: "{{ vault_mysql_user }}"
      WORDPRESS_DB_PASSWORD: "{{ vault_mysql_user_password }}"
    restart_policy: unless-stopped

- name:  WORDPRESS - Pull wp-cli image
  community.docker.docker_image:
    name: wordpress:cli
    source: pull

- name: WORDPRESS - Wait for files
  ansible.builtin.command:
    cmd: docker exec wordpress test -f /var/www/html/wp-config.php
  register: wp_file_ready
  until: wp_file_ready.rc == 0
  retries: 10
  delay: 3
  changed_when: false

- name: WORDPRESS - Check installation
  ansible.builtin.command:
    cmd: >-
      docker run --rm --user 33:33 --network app_net -v wp_data:/var/www/html
      -e WORDPRESS_DB_HOST=mysql -e WORDPRESS_DB_NAME={{ vault_mysql_database }}
      -e WORDPRESS_DB_USER={{ vault_mysql_user }}
      -e WORDPRESS_DB_PASSWORD={{ vault_mysql_user_password }}
      wordpress:cli wp core is-installed
  register: wp_installed
  failed_when: wp_installed.rc not in [0, 1]
  changed_when: false
  no_log: true

- name: WORDPRESS - Install
  ansible.builtin.command:
    cmd: >-
      docker exec -d wordpress:7.1-php8.2-apache 'wp core install
      --url="https://10.171.62.21"
      --title="LeSuperSite"
      --admin_user={{ wp_admin_user }}
      --admin_password={{ wp_admin_pass }}
      --admin_email={{ wp_admin_email }}
      --skip-email'
  when: wp_installed.rc == 1
    # no_log: true
 
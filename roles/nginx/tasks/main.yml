- name: NGINX - Install packages
  ansible.builtin.apt:
    name:
      - openssl

- name: NGINX - Créer le dossier du projet
  ansible.builtin.file:
      path: "{{ app_dir }}"
      state: directory
      mode: "0755"

- name: NGINX - Create ssl repository
  ansible.builtin.file:
    path: "{{ app_dir }}/ssl"
    state: directory
    mode: "0755"

- name: NGINX - Create data repository
  ansible.builtin.file:
    path: "{{ app_dir }}/data"
    state: directory
    mode: "0755"

- name: NGINX - Create certif
  ansible.builtin.command:
    cmd: openssl req -x509 -nodes -out {{ app_dir }}/ssl/cloud-1.cert -subj "/CN=cloud-1" -keyout {{ app_dir }}/ssl/cloud-1.key

- name: NGINX - Create conf dir
  ansible.builtin.file:
    path: "{{ app_dir }}/nginx/conf.d"
    state: directory

- name: NGINX - Push config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ app_dir }}/nginx/conf.d/default.conf"
    mode: "0644"
  notify: NGINX - Reload

- name: NGINX - Lancer le conteneur
  community.docker.docker_container:
    name: nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    # volumes:
    #   - "{{ app_dir }}/nginx/conf.d:/etc/nginx/conf.d:ro"
    networks:
      - name: app_net
    restart_policy: unless-stopped

- name: NGINX - Récupérer l'état du conteneur
  community.docker.docker_container_info:
    name: nginx
  register: nginx_info

- name: NGINX - Vérifier que nginx tourne
  ansible.builtin.assert:
    that:
      - nginx_info.exists
      - nginx_info.container.State.Running
    fail_msg: "Le conteneur nginx n'existe pas ou ne tourne pas"

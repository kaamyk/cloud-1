- name: NGINX - Create project directory
  ansible.builtin.file: { path: /opt/cloud1, state: directory, mode: "0755" }

- name: NGINX - Render compose file and nginx config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/opt/cloud1/{{ item.dest }}"
    mode: "{{ item.mode }}"
  notify: Restart nginx
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml, mode: "0644" }
    - { src: nginx.conf.j2,         dest: nginx.conf,         mode: "0644" }
    - { src: env.j2,                dest: .env,               mode: "0600" }
    - { src: wp-config.php.j2,      dest: wp-config.php,      mode: "0644" }
  no_log: true   # .env contains secrets

- name: NGINX - Deploy the stack
  community.docker.docker_compose_v2:
    project_src: /opt/cloud1
    state: present
    pull: missing

- name: NGINX - Restart nginx
  community.docker.docker_container:
    name: nginx
    restart: true